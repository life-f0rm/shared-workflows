---
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  workflow_call:

permissions: {}

jobs:
  conventional:
    if: github.event_name != 'merge_group'
    timeout-minutes: 5
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9_./-]+\))?!?: [^ ].*$'
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix(users): unlock re-added users'. Got: ${TITLE}"
            exit 1
          fi
